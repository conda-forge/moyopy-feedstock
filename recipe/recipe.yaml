schema_version: 1

context:
  version: 0.22.0

package:
  name: moyopy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/moyopy/moyopy-${{ version }}.tar.gz
  sha256: 92a377b4df17257618baa5184dd714575cb8c16c3eb399a62b07b6dba4b9c242

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.0,<2.0
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1,<2
    - pip
  run:
    - python
tests:
  - python:
      imports:
        - moyopy
      pip_check: true

about:
  summary: Python binding of Moyo
  license: MIT
  license_file:
    - LICENSE-MIT
    - THIRDPARTY.yml
  homepage: https://github.com/spglib/moyo

extra:
  recipe-maintainers:
    - ocefpaf
